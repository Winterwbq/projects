geometry:
  # SI units unless explicitly noted.
  # 2D Cartesian: x ∈ [-chamber_radius, +chamber_radius], y ∈ [0, target_to_wafer].
  target_to_wafer: 0.60
  target_radius: 0.18       # half-width of target in x; target spans x ∈ [-0.18, 0.18]
  wafer_radius: 0.15        # half-width of wafer in x;  wafer  spans x ∈ [-0.15, 0.15]
  chamber_radius: 0.24      # half-width of chamber; side walls at x = ±0.24
  erosion_area: 0.045       # effective erosion area per unit z-depth [m²/m → m]
  racetrack_radius: 0.105   # instantaneous rolling-magnet peak at x = +0.105 m
  racetrack_width: 0.025
  racetrack_mode: "one_sided" # use "symmetric" for mirror lobes at ±racetrack_radius

operation:
  target_power: 38000.0
  target_bias: -730.0
  target_dc_ramp_time: 5.0e-7
  target_current: 53.0
  wafer_rf_amplitude: 50.0
  wafer_rf_frequency: 13.56e6
  wafer_rf_ramp_time: 2.0e-7
  pressure_Cu: 4.0e-6 # Torr, effective Cu vapor pressure in self-ionization mode (no Ar)
  plasma_potential_guess: 10.0

mesh:
  # 2D Cartesian mesh: x from -x_max to +x_max, y from 0 to y_max.
  nx: 128       # cells in x (double original nr to cover -r to +r at same resolution)
  ny: 96        # cells in y (target to wafer)
  x_min: -0.24  # left wall [m]
  x_max: 0.24   # right wall [m]
  y_max: 0.60   # wafer position [m]

bfield:
  # CSV columns expected: x, y, Bx, By  (Bz = 0, out-of-plane)
  magnetron_csv: "fields/fake_magnetron_bmap.csv"
  external_csv: null
  synthetic_magnetron_B0_T: 0.10
  synthetic_external_By_T: 0.0   # uniform axial external field (y-direction)
  decay_length: 0.11

mc:
  n_particles_neutral: 8000
  n_particles_ion: 6000
  neutral_step: 0.006
  ion_dt: 2.0e-9
  ion_max_steps: 10000   # increased: Cu+ born in bulk needs ~5 μs to traverse 60 cm at thermal speed
  alpha_relax: 0.1
  max_iter: 100
  convergence_tol: 0.02
  random_seed: 13

physics:
  gamma_secondary: 0.08
  sputter_yield_model: "yamamura_like_fit"
  initial_f_ion: 0.1
  initial_L_ion: 0.05
  cu_neutral_energy_eV: 3.0
  cu_ion_birth_energy_eV: 0.15
  ion_temperature_eV: 0.15

zapdos:
  mode: "synthetic"
  input_dir: "runs/demo/zapdos_input"
  output_dir: "runs/demo/zapdos_output"
  executable: null

output:
  run_dir: "runs/demo"
  save_plots: true
